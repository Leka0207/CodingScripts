# ============================================================
#  J.A.R.V.I.S. — configuration
#  Everything you'd want to change lives here. Restart to apply.
# ============================================================

server:
  host: "127.0.0.1"
  port: 8123
  open_browser: true          # pop the HUD open automatically on start

brain:
  model: "claude-haiku-4-5"    # claude-opus-5 for more depth, claude-haiku-4-5 for speed
  effort: "medium"               # low | medium | high  — low keeps voice replies snappy
  max_tokens: 700
  history_turns: 6           # conversation turns kept in context
  web_search: true            # let Claude search the web itself (billed per search)
  # Used to localise web search results.
  location:
    city: "Livonia"
    region: "Michigan"
    country: "US"
    timezone: "America/Detroit"

  # The persona. Rewrite freely — this is the whole personality.
  persona: |
    You are JARVIS, the resident AI of this workshop. You speak with dry British
    composure: precise, unhurried, quietly amused. You address the user as "sir"
    but sparingly — roughly once every few exchanges, never twice in a row.

    Your replies are SPOKEN ALOUD. Therefore:
      - Keep spoken text to 1-4 sentences. Never read out lists or long data.
      - No markdown, no bullet points, no emoji, no asterisks, no URLs.
      - Write numbers and units the way a person says them ("about forty percent",
        "twenty-three degrees").
      - When something needs detail, put the detail on screen with hud_display and
        say only a one-line summary. This is the core rhythm: voice is brief,
        the screen carries the weight.

    You have real control of this machine. Use your tools rather than describing
    what the user could do. If a request is ambiguous but low-risk, choose sensibly
    and act. If it is destructive or irreversible, confirm first.

    Never invent system readings — call get_system_status. Never guess what is on
    screen — call capture_screen.

voice:
  wake_word: true             # false = HUD push-to-talk / typing only
  wake_threshold: 0.7         # 0.3 = more sensitive, 0.7 = fewer false triggers
  follow_up_window: 0        # seconds after a reply where no wake word is needed
  silence_ms: 500             # trailing silence that ends your sentence
  max_utterance_s: 15
  input_device: 1          # null = system default; run `python run.py devices`
  stt_model: "base.en"        # tiny.en | base.en | small.en | medium.en
  stt_compute: "int8"         # int8 (CPU) | float16 (CUDA GPU)
  stt_device: "cpu"           # cpu | cuda

tts:
  engine: "edge"              # edge (free, no key) | elevenlabs | pyttsx3 | none
  voice: "en-GB-SoniaNeuralNeural"   # try en-GB-ThomasNeural, en-GB-SoniaNeural
  rate: "+8%"                 # slightly brisk reads as more competent
  pitch: "-4Hz"
  elevenlabs_voice_id: ""     # only if engine: elevenlabs

# ------------------------------------------------------------
#  Protocols — named routines Jarvis can run in one command.
#  "Jarvis, run the workshop protocol."
# ------------------------------------------------------------
protocols:
  workshop:
    description: "Workbench setup: music, editor, project board."
    say: "Workshop protocol. Bringing the bench online."
    steps:
      - launch: spotify
      - launch: code
      - volume: 70

  focus:
    description: "Silence distractions and start a 50 minute work block."
    say: "Focus protocol engaged. Fifty minutes on the clock."
    steps:
      - volume: 45
      - timer: { minutes: 50, label: "Focus block complete" }

  briefing:
    description: "Morning briefing: system health plus the day's news."
    say: "Compiling your briefing."
    steps:
      - ask: "Give me a morning briefing. Check system status, then search the
              web for today's top technology headlines. Put the headlines on the
              HUD as a list panel and summarise the whole thing in two sentences."

  shutdown:
    description: "Stand down for the night."
    say: "Powering down the bench. Goodnight, sir."
    steps:
      - volume: 0

  # ---- added ----

  triage:
    description: "Read what's on screen and explain it."
    say: "Taking a look."
    steps:
      - ask: "Capture the screen. If there is an error, stack trace, or dialog,
              explain what it means and the most likely fix. Put the detail on
              the HUD as a text panel. Two sentences aloud, no more."

  pomodoro:
    description: "Four work blocks with breaks."
    say: "Four blocks. Starting now."
    steps:
      # Timers fire at absolute offsets from when the protocol runs,
      # so these are cumulative minutes, not durations.
      - volume: 15
      - timer: { minutes: 25, label: "Break — five minutes" }
      - timer: { minutes: 30, label: "Block two" }
      - timer: { minutes: 55, label: "Break — five minutes" }
      - timer: { minutes: 60, label: "Block three" }

  wrap:
    description: "Close out the day."
    say: "Wrapping up."
    steps:
      - ask: "Ask me what I got done today, then store the answer in memory with
              today's date. Check system status and mention anything that looks
              off. Keep it to two sentences."
      - volume: 0

  bench:
    description: "Lab session setup."
    say: "Bench is live."
    steps:
      - launch: code
      - ask: "Search memory for anything about my emissions testing work and
              remind me of the relevant details on the HUD. One sentence aloud."

  commute:
    description: "Weather and roads before heading out."
    say: "Checking outside."
    steps:
      - ask: "Search for current weather and any major traffic incidents around
              Livonia, Michigan. Put both on the HUD as a list panel. Tell me in
              one sentence whether to leave early."

  health:
    description: "Full system check."
    say: "Running diagnostics."
    steps:
      - ask: "Check system status including top processes by memory. Put a
              metrics panel and a table of the top five processes on the HUD.
              Flag anything unusual in one sentence."

# ------------------------------------------------------------
#  App aliases — what "open X" actually launches.
#  Windows: an .exe name on PATH, a full path, or a URL.
#  macOS: an app name. Linux: a binary name.
# ------------------------------------------------------------
apps:
  spotify: "spotify"
  code: "code"
  vscode: "code"
  chrome: "chrome"
  browser: "chrome"
  explorer: "explorer"
  terminal: "wt"
  calculator: "calc"
  steam: "steam"
  discord: "discord"
  github: "https://github.com"
  youtube: "https://youtube.com"
  gmail: "https://mail.google.com"

safety:
  allow_shell: true          # true enables the run_command tool. Read the README first.
  confirm_destructive: true