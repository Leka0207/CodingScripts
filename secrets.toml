# ─────────────────────────────────────────────────────────────
# Streamlit Secrets — fill these in before deploying
# ─────────────────────────────────────────────────────────────
# On Streamlit Community Cloud:
#   App dashboard → ⋮ menu → Settings → Secrets → paste contents
#
# For LOCAL testing only: keep this file at .streamlit/secrets.toml
# NEVER commit this file to GitHub (it's already in .gitignore)
# ─────────────────────────────────────────────────────────────

[email]
sender_address    = "yourgmail@gmail.com"       # Gmail you'll send FROM
app_password      = "xxxx xxxx xxxx xxxx"       # 16-char Gmail App Password (see README)
recipient_address = "youremail@gmail.com"       # Where you want to RECEIVE the results
